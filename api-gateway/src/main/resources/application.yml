server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://connect-sphere-frontend-kohl.vercel.app"
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - Authorization
            allowCredentials: true

      default-filters:
        - JwtAuthFilter
      routes:

        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1   

        - id: auth-service-oauth2
          uri: http://auth-service:8081
          predicates:
            - Path=/oauth2/**,/login/oauth2/**

        - id: post-service
          uri: http://post-service:8082
          predicates:
            - Path=/api/posts/**
          filters:
            - StripPrefix=1

        - id: comment-service
          uri: http://comment-service:8083
          predicates:
            - Path=/api/comments/**
          filters:
            - StripPrefix=1

        - id: like-service
          uri: http://like-service:8084
          predicates:
            - Path=/api/likes/**
          filters:
            - StripPrefix=1

        - id: follow-service
          uri: http://follow-service:8085
          predicates:
            - Path=/api/follows/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: http://notification-service:8086
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1

        - id: media-service
          uri: http://media-service:8087
          predicates:
            - Path=/api/media/**,/api/stories/**
          filters:
            - StripPrefix=1

        - id: media-service-legacy-files
          uri: http://media-service:8087
          predicates:
            - Path=/media/files/**

        - id: search-service
          uri: http://search-service:8088
          predicates:
            - Path=/api/search/**,/api/hashtags/**
          filters:
            - StripPrefix=1

        - id: payment-service
          uri: http://payment-service:8089
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1

# JWT
jwt:
  secret: connectsphere-local-jwt-secret-key-2026-change-me-minimum-32-chars

# Eureka
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
